<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:64px;background:#101317;border-top:1px solid #1E232A;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;font-family:'Space Grotesk',sans-serif;flex:none;">
  <div onClick="{{ onInicio }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ cInicio }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg>
    <span style="font-size:10px;font-weight:600;color:{{ cInicio }};">Inicio</span>
  </div>
  <div onClick="{{ onClientes }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ cClientes }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></svg>
    <span style="font-size:10px;font-weight:600;color:{{ cClientes }};">Clientes</span>
  </div>
  <div onClick="{{ onInventario }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ cInventario }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7.5L12 3 3 7.5v9L12 21l9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5"/><path d="M12 12v9"/></svg>
    <span style="font-size:10px;font-weight:600;color:{{ cInventario }};">Inventario</span>
  </div>
  <div onClick="{{ onCitas }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ cCitas }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
    <span style="font-size:10px;font-weight:600;color:{{ cCitas }};">Citas</span>
  </div>
  <div onClick="{{ onOrdenes }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ cOrdenes }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a3 3 0 016 0"/><path d="M9 12h6M9 16h4"/></svg>
    <span style="font-size:10px;font-weight:600;color:{{ cOrdenes }};">Órdenes</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;clientes&quot;,&quot;inventario&quot;,&quot;citas&quot;,&quot;ordenes&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = (this.props.active ?? 'inicio').toLowerCase();
    const on = '#A5B5BF', off = '#525A62';
    return {
      cInicio: active === 'inicio' ? on : off,
      cClientes: active === 'clientes' ? on : off,
      cInventario: active === 'inventario' ? on : off,
      cCitas: active === 'citas' ? on : off,
      cOrdenes: active === 'ordenes' ? on : off,
    };
  }
}
</script>
</body>
</html>
