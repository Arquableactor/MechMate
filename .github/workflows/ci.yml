name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Postgres real para los tests de integración del ledger (triggers). Local usa
    # embedded-postgres; en CI usamos un service container (más estable que bajar
    # el binario beta). globalSetup detecta TEST_DATABASE_URL y NO usa embedded.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mechmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mechmate_test
          # Dummies (no son secretos): los tests son herméticos, esto es red de
          # seguridad por si un test futuro llega a leer config de Auth0.
          AUTH0_DOMAIN: test-tenant.us.auth0.com
          AUTH0_AUDIENCE: https://api.test.automecanica.do
          AUTH0_ISSUER_URL: https://test-tenant.us.auth0.com/

      - name: Build
        run: pnpm build
