name: mechmate
description: "MechMate — app del taller (ERP): clientes, vehículos, órdenes, DVI, aprobación y cobro."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  # Cliente de la API GENERADO desde apps/api/openapi.json (tool/gen_api.sh). No se edita a mano.
  mechmate_api:
    path: packages/mechmate_api
  cupertino_icons: ^1.0.9
  auth0_flutter: ^2.6.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Geist (SIL OFL 1.1, ver assets/fonts/geist/OFL.txt): tipografía en Android y web.
  # En iPhone/iPad se usa la del sistema (SF Pro).
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
        - asset: assets/fonts/geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/geist/Geist-Bold.ttf
          weight: 700
