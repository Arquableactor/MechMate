# Lints de la app (effective_dart vía flutter_lints) + chequeos estrictos de tipos.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Generado desde el OpenAPI (tool/gen_api.sh): no se edita ni se lintea.
    - packages/mechmate_api/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
